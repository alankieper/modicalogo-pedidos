<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>Pedido al catálogo</title><!-- modicalogo:router -->
<script>
(async () => {
  const q = new URLSearchParams(location.search), n = (q.get("n") || "").replace(/[^a-z0-9-]/g, "");
  let nueva = false;
  if (n) try { nueva = (await fetch(n + "/index.html", { method: "HEAD", cache: "no-cache" })).ok; } catch {}
  q.delete("n");
  location.replace(nueva ? n + "/" + (q.toString() ? "?" + q : "") + location.hash : "clasica.html" + location.search + location.hash);
})();
</script></head><body></body></html>
